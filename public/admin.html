<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>企微消息触发器</title>
  <link rel="stylesheet" href="/admin/styles.css">
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div>
        <p class="eyebrow">WECOM × OPEN WEBUI</p>
        <h1>企微消息触发器</h1>
        <p class="subtitle">批量选择用户或群聊，填写消息参数并查看逐条发送结果。</p>
      </div>
      <div id="health" class="status pending">正在检查服务…</div>
    </header>

    <form id="trigger-form" novalidate>
      <section class="card">
        <div class="section-title">
          <span class="step">01</span>
          <div><h2>连接与目标</h2><p>Token 仅保存在当前页面内存中，刷新后清除。</p></div>
        </div>
        <div class="grid two">
          <label>触发器 Token
            <input id="token" type="password" autocomplete="off" required placeholder="TRIGGER_API_TOKEN">
          </label>
          <label>目标类型
            <select id="target-type">
              <option value="user">企微用户 userid</option>
              <option value="group">企微群聊 chatid</option>
            </select>
          </label>
        </div>
        <label>目标 ID（每行一个，也可从 Excel 直接粘贴）
          <textarea id="target-ids" rows="7" required placeholder="woQiZa...&#10;woQiZb..."></textarea>
        </label>
        <div class="import-row">
          <label class="file-button">上传表格
            <input id="target-file" type="file" accept=".xlsx,.csv,.tsv,.txt">
          </label>
          <span id="target-count" class="count">0 个有效目标</span>
          <span class="hint">支持 XLSX、CSV、TSV、TXT；自动识别 userid、chatid、target_id 或 id 列。</span>
        </div>
      </section>

      <section class="card">
        <div class="section-title">
          <span class="step">02</span>
          <div><h2>消息参数</h2><p>同一份内容将发送给上方全部目标。</p></div>
        </div>
        <div class="grid two">
          <label>消息类型
            <select id="message-type">
              <option value="text">文本</option>
              <option value="markdown">Markdown</option>
              <option value="ai">AI 生成</option>
              <option value="template_card">模板卡片 JSON</option>
              <option value="image">图片</option>
              <option value="file">文件</option>
              <option value="voice">语音</option>
              <option value="video">视频</option>
            </select>
          </label>
          <label>请求 ID（可留空自动生成）
            <input id="request-id" type="text" maxlength="128" placeholder="batch-20260827-001">
          </label>
        </div>
        <label id="content-field">消息内容 / AI 提示词
          <textarea id="content" rows="7" placeholder="请输入要发送的内容"></textarea>
        </label>
        <div id="media-fields" class="media-fields hidden">
          <div class="grid two">
            <label>媒体文件
              <input id="media-file" type="file">
            </label>
            <label id="media-url-field">图片 HTTPS 地址（与文件二选一）
              <input id="media-url" type="url" placeholder="https://example.com/image.png">
            </label>
          </div>
          <div id="video-fields" class="grid two hidden">
            <label>视频标题<input id="video-title" type="text" maxlength="128"></label>
            <label>视频说明<input id="video-description" type="text" maxlength="512"></label>
          </div>
        </div>
      </section>

      <section class="actions">
        <button id="send-button" class="primary" type="submit">批量发送</button>
        <button id="clear-button" class="secondary" type="button">清空结果</button>
        <span id="progress" aria-live="polite"></span>
      </section>
    </form>

    <section class="card results-card">
      <div class="section-title compact">
        <span class="step">03</span>
        <div><h2>发送结果</h2><p id="summary">尚未发送</p></div>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>目标 ID</th><th>状态</th><th>发送方式</th><th>详情</th></tr></thead>
          <tbody id="results"><tr class="empty"><td colspan="4">发送后将在此显示逐条结果</td></tr></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="/admin/app.js" defer></script>
</body>
</html>
